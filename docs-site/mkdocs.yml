site_name: PHPRay
site_description: Always-on request tracing for PHP with near-zero overhead
site_url: https://phpray.dev/docs/
docs_dir: docs

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font: false
  palette:
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotation
    - content.code.select
    - content.tabs
    - header.autohide

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.emoji

nav:
  - Home: index.md
  - Install:
    - Quick start: install/quickstart.md
    - Manual install: install/manual.md
    - Shared hosting: install/shared-hosting.md
  - Configuration:
    - Extension (INI): configuration/extension.md
    - Collector: configuration/collector.md
  - Usage:
    - Dashboard: usage/dashboard.md
    - CLI: usage/cli.md
    - Trace format: usage/trace-format.md
    - WordPress plugin: usage/wordpress-plugin.md
    - DirectAdmin: usage/directadmin.md
  - Cloud:
    - Overview & plans: cloud/overview.md
    - Ingest protocol v1: cloud/ingest.md
  - Troubleshooting: troubleshooting.md
  - FAQ: faq.md

extra_css:
  - stylesheets/phpray.css

copyright: "© 2026 IQgroup Adam Buhl (IQhost) · PHPRay core: Apache-2.0"
